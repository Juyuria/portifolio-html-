            </ul>
        </nav>
    </header>

    <main class="main_contato">

        <form action="#" method="submit" id="formulario">
            <label for="name">Nome: </label>
            <input id="name" type="text" name="name" placeholder="Digite seu nome" />
            <span id="errNome"></span>

            <label for="email">Email: </label>
            <input id="email" type="text" name="email" placeholder="Digite seu email" />
            <span id="errEmail"></span>

            <label for="subject">Assunto: </label>
            <input id="subject" type="text" name="subject" placeholder="Digite o assunto da mensagem" />
            <span id="errSubject"></span>

            <label for="message">Mensagem: </label>
            <textarea id="message" name="message" placeholder="Digite sua mensagem"></textarea>

            <button type="submit">Enviar</button>
        </form>

        <article class="article_mapa">
            <address>
                <p>Av. Paulista, 100</p>
                <p>São Paulo - SP</p>
            </address>

            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3657.106696296001!2d-46.65390548502213!3d-23.56461118468113!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce59c8da0aa315%3A0xd59f9431f0c9776!2sAv.%20Paulista%2C%20100%20-%20Bela%20Vista%2C%20S%C3%A3o%20Paulo%20-%20SP%2C%2001310-000!5e0!3m2!1spt-BR!2sbr!4v1614864452565!5m2!1spt-BR!2sbr"
                width="100%"
                height="300"
                style="border: 0"
                allowfullscreen=""
                loading="lazy"
            ></iframe>
        </article>

    </main>

    <footer>
        <section id="redes_sociais">
